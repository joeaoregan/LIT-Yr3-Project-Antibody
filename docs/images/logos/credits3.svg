<svg xmlns="http://www.w3.org/2000/svg" width="340" height="60" viewBox="0 0 340 60">
    <defs>
    <style>
      :root {
        /* LIGHT THEME */
        --fill-start: #3ce5ff;
        --fill-end: #d1d5db;
        --stroke-color: #000000;
      }
      
      @media (prefers-color-scheme: dark) {
        :root {
          /* DARK THEME */
          --fill-start: #0044b4;
          --fill-end: #000000;
          --stroke-color: #ffffff;
        }
      }
      
      .scroll-text {
        font-family: 'Impact', 'Arial Black', sans-serif;
        font-size: 36px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        
        fill: url(#text-fill-gradient);
        stroke: var(--stroke-color);
        stroke-width: 6px;
        stroke-linejoin: round;
        paint-order: stroke fill;  
      }

      .stop-start { stop-color: var(--fill-start); }
      .stop-end { stop-color: var(--fill-end); }
    </style>

    <clipPath id="tight-text-window">
      <rect x="0" y="0" width="340" height="60" />
    </clipPath>

    <linearGradient id="text-fill-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="stop-start" />
      <stop offset="100%" class="stop-end" />
    </linearGradient>
  </defs>

  <!-- Box outline enabled for layout validation -->
  <rect x="0" y="0" width="340" height="60" fill="none" stroke="var(--stroke-color)" stroke-width="2" />

  <g clip-path="url(#tight-text-window)">
    <g>
      <!-- Moves left horizontally by exactly the 830px text string length -->
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        from="0,0" 
        to="-830,0" 
        dur="10s" 
        repeatCount="indefinite" />

      <!-- Track 1: First continuous run sitting flush with the left canvas edge -->
      <text x="0" y="44" class="scroll-text">A Game By Joe O'Regan And Seán Horgan • </text>

      <!-- Track 2: Loop bridge aligned immediately at the 830px width threshold point -->
      <text x="830" y="44" class="scroll-text">A Game By Joe O'Regan And Seán Horgan • </text>
    </g>
  </g>
</svg>